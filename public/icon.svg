<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080D0"/>
      <stop offset="100%" stop-color="#005a94"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2f0fb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Isometric Warehouse Box -->
  <g transform="translate(256, 230)">
    <!-- Top Face -->
    <path d="M0 -110 L120 -45 L0 20 L-120 -45 Z" fill="url(#boxGrad)"/>
    <!-- Left Face -->
    <path d="M-120 -45 L0 20 L0 150 L-120 85 Z" fill="#cbe4f7"/>
    <!-- Right Face -->
    <path d="M0 20 L120 -45 L120 85 L0 150 Z" fill="#a4d2f3"/>
    
    <!-- Box Flaps / Tape Line -->
    <path d="M0 -110 L0 20" stroke="#0080D0" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Barcode Lines on Front Face -->
    <g transform="translate(-85, 25) skewY(28)">
      <rect x="0" y="0" width="4" height="40" fill="#005a94"/>
      <rect x="8" y="0" width="8" height="40" fill="#005a94"/>
      <rect x="20" y="0" width="4" height="40" fill="#005a94"/>
      <rect x="28" y="0" width="12" height="40" fill="#005a94"/>
      <rect x="44" y="0" width="4" height="40" fill="#005a94"/>
      <rect x="52" y="0" width="8" height="40" fill="#005a94"/>
    </g>
  </g>
  <!-- Text Label -->
  <text x="256" y="445" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">VERDU PAÑOL</text>
</svg>
